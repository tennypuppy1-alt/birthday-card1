<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>명연 생일 카드</title>
<style>
  :root {
    color-scheme: light;
    --coral: #e8694a;
    --coral-deep: #c44d31;
    --cream: #fff8ec;
    --ink: #3b2420;
    --muted: #80635a;
    --butter: #f7c95c;
    --mint: #8fcfb8;
    --pink: #f6a6b2;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background-color: var(--coral);
    background-image: radial-gradient(rgba(255, 248, 236, .28) 2px, transparent 2.5px);
    background-size: 26px 26px;
    color: var(--ink);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    word-break: keep-all;
  }

  .card {
    width: 100%;
    max-width: 440px;
    padding: 32px 28px 28px;
    background: var(--cream);
    border-radius: 20px;
    box-shadow: 0 8px 0 var(--coral-deep), 0 24px 48px rgba(59, 36, 32, .3);
    text-align: center;
  }

  .date {
    margin: 0;
    color: var(--coral-deep);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .12em;
  }

  h1 {
    margin: 10px 0 20px;
    font-size: clamp(27px, 8vw, 34px);
    line-height: 1.3;
  }

  .cake { display: block; width: min(100%, 260px); margin: 0 auto; }

  .flame {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: flicker 1.1s ease-in-out infinite alternate;
    transition: opacity .2s;
  }
  .flame:nth-of-type(2n) { animation-delay: -.5s; }
  .smoke { opacity: 0; }

  .out .flame { opacity: 0; }
  .out .smoke { animation: rise 1.4s ease-out; }

  @keyframes flicker {
    from { transform: scale(1) rotate(-3deg); }
    to { transform: scale(.88, 1.1) rotate(3deg); }
  }
  @keyframes rise {
    0% { opacity: .7; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-22px); }
  }

  button {
    margin-top: 16px;
    padding: 12px 22px;
    min-height: 44px;
    border: 0;
    border-radius: 999px;
    background: var(--ink);
    color: var(--cream);
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { background: var(--coral-deep); }
  button:focus-visible { outline: 3px solid var(--butter); outline-offset: 2px; }

  .wish {
    min-height: 1.6em;
    margin: 14px 0 0;
    color: var(--coral-deep);
    font-weight: 700;
    line-height: 1.6;
  }

  .message {
    margin-top: 18px;
    padding-top: 20px;
    border-top: 2px dashed #e7d5bd;
    line-height: 1.8;
  }
  .message p { margin: 0 0 10px; }
  .sign { margin-top: 16px; color: var(--muted); font-weight: 700; }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .flame, .out .smoke { animation: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <p class="date">12월 9일</p>
    <h1>명연아,<br>생일 축하해용용!</h1>

    <svg class="cake" id="cake" viewBox="0 0 240 190" role="img" aria-label="촛불 다섯 개가 꽂힌 생일 케이크">
      <g id="candles"></g>
      <rect x="44" y="72" width="152" height="38" rx="9" fill="#f6a6b2"/>
      <path d="M44 84c0-7 5-12 12-12h128c7 0 12 5 12 12 0 7-9 7-11 0-3 11-15 11-18 0-3 8-14 8-17 0-3 14-17 14-20 0-3 8-14 8-17 0-3 10-16 10-19 0-3 8-14 8-17 0-3 7-13 7-16 0-3 6-17 7-17 0z" fill="#fff8ec" stroke="#f0dfc6"/>
      <rect x="24" y="108" width="192" height="52" rx="10" fill="#8fcfb8"/>
      <path d="M24 122c0-8 6-14 14-14h164c8 0 14 6 14 14 0 8-11 8-13 0-3 13-18 13-21 0-3 9-16 9-19 0-3 15-20 15-23 0-3 9-16 9-19 0-3 12-19 12-22 0-3 9-16 9-19 0-3 8-16 8-19 0-3 7-19 8-19 0z" fill="#fff8ec" stroke="#f0dfc6"/>
      <ellipse cx="120" cy="168" rx="112" ry="13" fill="#f7c95c"/>
      <rect x="24" y="142" width="192" height="20" rx="8" fill="#6fb8a0"/>
    </svg>

    <button id="blow" type="button">소원 빌고 촛불 끄기</button>
    <p class="wish" id="wish" aria-live="polite"></p>

    <section class="message">
      <p>12월 9일은 명연이가 태어난 날이라 미미도 아침부터 신이 났어용용.</p>
      <p>새로운 한 살에는 크게 웃을 일이 더 많고, 좋아하는 사람들과 맛있는 걸 잔뜩 먹는 날이 가득하면 좋겠어용용.</p>
      <p>태어나 줘서 고마워용용.</p>
      <p class="sign">— 미미가</p>
    </section>
  </main>

  <canvas id="confetti" aria-hidden="true"></canvas>

<script>
  const cake = document.getElementById('cake');
  const button = document.getElementById('blow');
  const wish = document.getElementById('wish');
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const colors = ['#e8694a', '#f7c95c', '#8fcfb8', '#f6a6b2', '#7fa8e0'];

  const candleColors = ['#f7c95c', '#7fa8e0', '#e8694a', '#8fcfb8', '#c9a0dc'];
  const candles = candleColors.map((color, i) => {
    const x = 72 + i * 24;
    return `
      <path class="smoke" d="M${x} 28c-4-5 4-8 0-14" fill="none" stroke="#b9a99b" stroke-width="2" stroke-linecap="round"/>
      <path class="flame" d="M${x} 20c6 7 7 11 5 14-1 3-3 4-5 4s-4-1-5-4c-2-3-1-7 5-14z" fill="#f59e2c"/>
      <rect x="${x - 4}" y="38" width="8" height="36" rx="3" fill="${color}"/>`;
  });
  document.getElementById('candles').innerHTML = candles.join('');

  let pieces = [];
  let frame = null;

  function burst() {
    if (reducedMotion) return;
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    const fresh = Array.from({ length: 160 }, () => ({
      x: innerWidth / 2,
      y: innerHeight * .4,
      vx: (Math.random() - .5) * 16,
      vy: Math.random() * -14 - 3,
      size: Math.random() * 7 + 5,
      spin: Math.random() * Math.PI,
      spinSpeed: (Math.random() - .5) * .3,
      color: colors[Math.floor(Math.random() * colors.length)]
    }));
    pieces = pieces.concat(fresh);
    if (!frame) frame = requestAnimationFrame(draw);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces = pieces.filter(p => p.y < canvas.height + 20);
    for (const p of pieces) {
      p.vy += .32;
      p.vx *= .99;
      p.x += p.vx;
      p.y += p.vy;
      p.spin += p.spinSpeed;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.spin);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * .66);
      ctx.restore();
    }
    frame = pieces.length ? requestAnimationFrame(draw) : null;
  }

  button.addEventListener('click', () => {
    const isOut = cake.classList.toggle('out');
    button.textContent = isOut ? '촛불 다시 켜기' : '소원 빌고 촛불 끄기';
    wish.textContent = isOut ? '방금 빈 소원, 꼭 이루어질 거야용용!' : '';
    if (isOut) burst();
  });
</script>
</body>
</html>
